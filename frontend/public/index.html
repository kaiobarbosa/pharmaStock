<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10110f" />
    <title>PharmaStock | Login</title>
    <link rel="stylesheet" href="../src/style/padronization.css" />
    <link rel="stylesheet" href="../src/style/sidebar.css" />
    <link rel="stylesheet" href="../src/style/index.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside
        class="sidebar"
        data-sidebar
        data-sidebar-mode="auth"
        data-note-title="Acesso seguro"
        data-note-detail="Gestão unificada da rede"
        data-footer="Ambiente corporativo"
      ></aside>

      <main class="hero-section">
        <header class="hero-header">
          <div>
            <p class="hero-header__eyebrow">PharmaStock</p>
            <p class="hero-header__title">Gestão unificada de estoque</p>
          </div>
          <span class="hero-header__context">Acesso da equipe</span>
        </header>

        <section class="hero-content" aria-labelledby="login-title">
          <div class="auth-shell">
            <div class="auth-card login-card">
              <div class="auth-card__heading">
                <p class="section-kicker">Bem-vindo de volta</p>
                <h1 id="login-title">Entrar no sistema</h1>
                <p class="auth-card__description">
                  Informe seus dados para acessar o PharmaStock.
                </p>
              </div>

              <form class="auth-form login-form" autocomplete="on">
                <div class="field">
                  <label for="email">E-mail</label>
                  <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Email.."
                    autocomplete="username"
                    required
                  />
                </div>

                <div class="field">
                  <label for="password">Senha</label>
                  <div class="input-shell">
                    <input
                      id="password"
                      name="password"
                      type="password"
                      placeholder="Senha.."
                      autocomplete="current-password"
                      required
                    />
                    <button
                      class="password-toggle"
                      type="button"
                      data-password-toggle="password"
                      aria-label="Visualizar senha"
                      title="Visualizar senha"
                    >
                      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2.8 12s3.25-5.4 9.2-5.4 9.2 5.4 9.2 5.4-3.25 5.4-9.2 5.4S2.8 12 2.8 12Z" />
                        <circle cx="12" cy="12" r="2.35" />
                      </svg>
                    </button>
                  </div>
                </div>

                <button class="link-button forgot-password" type="button">
                  Esqueceu a senha?
                </button>

                <button class="primary-button login-submit" type="submit">
                  Entrar
                  <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                    <path d="M4 10h11M10 5l5 5-5 5" />
                  </svg>
                </button>
                <p id="startup-feedback" class="startup-feedback" role="alert" hidden></p>
              </form>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="../src/components/sidebar.js" defer></script>
    <script src="../src/js/index.js" defer></script>
  </body>
</html>
