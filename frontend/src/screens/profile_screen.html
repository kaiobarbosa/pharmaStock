<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10110f" />
    <title>PharmaStock | Perfil</title>
    <link rel="stylesheet" href="../style/padronization.css" />
    <link rel="stylesheet" href="../style/sidebar.css" />
    <link rel="stylesheet" href="../style/profile_screen.css" />
  </head>
  <body>
    <div class="app-shell app-shell--app">
      <aside class="sidebar" data-sidebar data-sidebar-mode="app" data-active="profile"></aside>
      <main class="hero-section profile-main">
        <header class="hero-header">
          <div>
            <p class="hero-header__eyebrow">PharmaStock</p>
            <p class="hero-header__title">Perfil do usuário</p>
          </div>
          <span class="hero-header__context">Conta pessoal</span>
        </header>

        <div class="hero-content profile-content">
          <div class="profile-page">
            <p class="page-feedback" id="profile-page-feedback" role="status" aria-live="polite" hidden></p>
            <div class="profile-page-heading">
              <div>
                <p class="section-kicker">Dados da conta</p>
                <h1>Meu perfil</h1>
                <p>Consulte e atualize seus dados pessoais.</p>
              </div>
              <a class="secondary-button profile-return" href="home_screen.html">Voltar para o início</a>
            </div>

            <section class="profile-panel" id="profile-details-panel" aria-labelledby="profile-display-name">
              <div class="profile-card-heading">
                <div class="profile-avatar" aria-hidden="true" id="profile-avatar">—</div>
                <div>
                  <p class="section-kicker" id="profile-role">Cargo</p>
                  <h2 id="profile-display-name">Carregando perfil...</h2>
                  <p id="profile-display-branch">—</p>
                </div>
                <button class="primary-button" id="edit-profile-button" type="button" hidden>Editar informações</button>
              </div>

              <div class="profile-details-grid" id="profile-details-grid"></div>

              <form class="profile-edit-form" id="profile-edit-form" hidden>
                <div class="panel-heading">
                  <div>
                    <p class="section-kicker">Dados da conta</p>
                    <h2>Editar informações pessoais</h2>
                  </div>
                </div>
                <div class="form-grid">
                  <div class="field"><label for="profile-first-name">Nome</label><input id="profile-first-name" name="first_name" maxlength="100" autocomplete="given-name" required /></div>
                  <div class="field"><label for="profile-last-name">Sobrenome</label><input id="profile-last-name" name="last_name" maxlength="100" autocomplete="family-name" required /></div>
                  <div class="field"><label for="profile-cpf">CPF</label><input id="profile-cpf" name="cpf" inputmode="numeric" maxlength="14" autocomplete="off" required /></div>
                  <div class="field"><label for="profile-email">E-mail</label><input id="profile-email" name="email" type="email" maxlength="254" autocomplete="email" required /></div>
                  <div class="field field--wide" id="profile-current-password-field" hidden><label for="profile-current-password">Senha atual para confirmar a troca do e-mail</label><input id="profile-current-password" name="current_password" type="password" autocomplete="current-password" /></div>
                </div>
                <div class="form-actions">
                  <p class="form-feedback" id="profile-form-feedback" role="status" aria-live="polite" hidden></p>
                  <button class="secondary-button" id="cancel-profile-edit" type="button">Cancelar</button>
                  <button class="primary-button" type="submit">Confirmar alterações</button>
                </div>
              </form>
            </section>
          </div>
        </div>
      </main>
    </div>
    <script src="../components/sidebar.js" defer></script>
    <script src="../js/profile_screen.js" defer></script>
  </body>
</html>
