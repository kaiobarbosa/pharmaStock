<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10110f" />
    <title>PharmaStock | Início</title>
    <link rel="stylesheet" href="../style/padronization.css" />
    <link rel="stylesheet" href="../style/sidebar.css" />
    <link rel="stylesheet" href="../style/home_screen.css" />
  </head>
  <body>
    <div class="app-shell app-shell--app">
      <aside class="sidebar" data-sidebar data-sidebar-mode="app" data-active="home"></aside>

      <main class="hero-section home-main">
        <header class="hero-header">
          <div>
            <p class="hero-header__eyebrow">PharmaStock</p>
            <p class="hero-header__title">Visão geral</p>
          </div>
          <span class="hero-header__context">Área corporativa</span>
        </header>

        <div class="hero-content home-content">
          <div class="home-dashboard">
            <section class="home-search-section" aria-labelledby="product-search-title">
              <div class="home-section-heading">
                <p class="section-kicker">Consulta rápida</p>
                <h1 id="product-search-title">Encontre um produto</h1>
                <p>Pesquise no catálogo de produtos cadastrados.</p>
              </div>

              <form id="product-search-form" class="product-search" role="search" novalidate>
                <label class="visually-hidden" for="product-search-input">Pesquisar produtos cadastrados</label>
                <svg class="product-search__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <circle cx="10.8" cy="10.8" r="6.3" />
                  <path d="m15.5 15.5 4.2 4.2" />
                </svg>
                <input
                  id="product-search-input"
                  name="query"
                  type="search"
                  placeholder="Nome, princípio ativo ou código do produto"
                  autocomplete="off"
                />
                <button class="product-search__button" type="submit">Buscar</button>
              </form>
              <p class="product-search__feedback" id="product-search-feedback" role="status" aria-live="polite" hidden></p>
            </section>

            <section class="recent-sales-section" aria-labelledby="recent-sales-title">
              <div class="recent-sales-heading">
                <div>
                  <p class="section-kicker">Atividade recente</p>
                  <h2 id="recent-sales-title">Últimos produtos vendidos</h2>
                </div>
                <span class="recent-sales-heading__caption">Seu histórico de vendas</span>
              </div>

              <div class="sales-table-wrap">
                <table class="sales-table">
                  <thead>
                    <tr>
                      <th scope="col">Data</th>
                      <th scope="col">Produto</th>
                      <th scope="col">Quantidade</th>
                      <th scope="col">Filial</th>
                    </tr>
                  </thead>
                  <tbody id="recent-sales-body">
                    <tr class="sales-table__empty-row">
                      <td colspan="4">
                        <span class="empty-state-mark" aria-hidden="true">—</span>
                        <span>As vendas recentes aparecerão aqui.</span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
    <script src="../components/sidebar.js" defer></script>
    <script src="../js/home_screen.js" defer></script>
  </body>
</html>
